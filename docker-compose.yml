services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruit-lens-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/recruit_lens
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:8000","http://localhost:5173"]
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEMO_EMAIL=${DEMO_EMAIL:-admin@recruitlens.local}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: recruit-lens-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recruit_lens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
