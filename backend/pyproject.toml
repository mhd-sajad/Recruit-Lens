[project]
name = "recruit-lens-backend"
version = "0.1.0"
description = "Recruit Lens backend service: explainable, evidence-grounded AI recruiter platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "numpy>=1.26.0",
    "bm25s>=0.2.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"
