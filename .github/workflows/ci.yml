name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy Typecheck
        run: uv run mypy app tests

      - name: Run Pytest with Coverage Bar (>=80%)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Build
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

  gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
